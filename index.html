<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Xbox 360 Controller Tester</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.svg" />
</head>
<body>
  <h2>🎮 Xbox 360 Controller Tester</h2>
  
  <div id="controller-layout">
    <div id="top-buttons">
        <div id="top-of-top">
            <div class="button-indicator" data-btn="6">LT</div>
            <div class="button-indicator" data-btn="7">RT</div>
        </div>
        <div id="bottom-of-top">
            <div class="button-indicator" data-btn="4">LB</div>
            <div class="button-indicator" data-btn="8">View</div>
            <div class="button-indicator" data-btn="16">Xbox</div>
            <div class="button-indicator" data-btn="9">Menu</div>
            <div class="button-indicator" data-btn="5">RB</div>
        </div>
      </div>
      
    <div id="middle-and-bottom-buttons">
      <div id="left-stick-area">
        <div class="stick button-indicator" id="left-stick" data-btn="10"><div class="dot" id="left-dot"></div></div>
        <div class="axis-value" id="left-axis-value">X: 0.00, Y: 0.00</div>
      </div>
      
      <div id="bottom-buttons">
        <div id="dpad">
            <div class="button-indicator" data-btn="12">↑</div>
            <div class="button-indicator" data-btn="14">←</div>
            <div class="button-indicator" data-btn="13">↓</div>
            <div class="button-indicator" data-btn="15">→</div>
          </div>
      
          <div id="right-stick-area">
            <div class="stick button-indicator" id="right-stick" data-btn="11"><div class="dot" id="right-dot"></div></div>
            <div class="axis-value" id="right-axis-value">X: 0.00, Y: 0.00</div>
          </div>
      </div>
      <div id="abxy">
        <div class="button-indicator" data-btn="3">Y</div>
        <div class="button-indicator" data-btn="1">B</div>
        <div class="button-indicator" data-btn="2">X</div>
        <div class="button-indicator" data-btn="0">A</div>
      </div>
    </div>
  </div>
  <div id="axis-log-summary"></div>
  <button id="toggle-log-btn">📝 Toggle Log View</button>
    <div id="log" class="hidden">Waiting for controller input...</div>
    

  <script src="x_input_detect.js"></script>
  <script src="virtual_controller.js"></script>
</body>
</html>
